# Dongle Kconfig overrides.
# Dongle is the USB central — it connects to both halves over BLE
# and presents as a USB HID device to the host computer.
# USB remote wakeup (waking the PC from sleep) is handled automatically
# by ZMK when the USB bus is suspended and a key is pressed.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
